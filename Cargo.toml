[package]
name = "cf-tunnel-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
capnp = "0.27.3"
capnp-futures = "0.27.0"
capnp-rpc = "0.27.2"
futures = "0.3.34"
httparse = "1.10.1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "io-util", "signal", "sync"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[build-dependencies]
capnpc = "0.27.0"

[dev-dependencies]
httparse = "1.10.1"
