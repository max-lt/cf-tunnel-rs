[package]
name = "cf-tunnel-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Client library for Cloudflare Tunnel over QUIC"

[dependencies]
base64 = "0.23.1"
hickory-resolver = { version = "0.26", features = ["tls-ring", "webpki-roots"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1.0.104"
httparse = "1.10.1"
tokio = { version = "1", features = ["macros", "net", "signal", "io-util"] }
